name: NVIDIA Polygraphy multi-input reproduction

on:
  push:
    branches: [agent/nvidia-polygraphy-4607-20260910]
    paths:
      - 'evidence/in-progress/nvidia-polygraphy-4607/**'
      - '.github/workflows/nvidia-polygraphy-4607.yml'

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce branch freezing on CPU with controls
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      UPSTREAM_SHA: c93b7d4893184af4882f9f1862e13a5c64b8677d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NVIDIA/TensorRT
          ref: c93b7d4893184af4882f9f1862e13a5c64b8677d
          path: upstream
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install CPU dependencies and exact upstream Python tools
        run: |
          python -m pip install 'numpy==2.3.5' 'onnx==1.22.0' 'onnxruntime==1.23.2' 'colored==2.3.1'
          python -m pip install setuptools wheel
          python -m pip install --no-deps --no-build-isolation -e upstream/tools/Polygraphy -e upstream/tools/onnx-graphsurgeon
      - name: Run reproduction and controls
        run: python packet/evidence/in-progress/nvidia-polygraphy-4607/reproduce.py --artifacts artifacts
      - name: Print evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          result = Path('artifacts/result.json')
          if result.exists():
              print(result.read_text())
          for log in sorted(Path('artifacts').glob('*/reduce.log')):
              print(str(log))
              print(log.read_text()[-3500:])
          PY
